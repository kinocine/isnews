<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인스타 연예뉴스 카드뉴스 제작기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --primary: #e50914; --dark: #121212; --panel: #1e1e1e; --border: #333; --text: #eee; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
  body { background: var(--dark); color: var(--text); padding: 24px; }
  h1, h2 { color: #fff; margin-bottom: 12px; }

  /* 1. 상단 원스톱 입력 섹션 */
  .input-dashboard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 30px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px;
  }
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  label { font-size: 0.85rem; font-weight: bold; color: #aaa; }
  input[type="text"], textarea {
    background: #111; border: 1px solid var(--border); color: #fff;
    padding: 10px; border-radius: 6px; font-size: 0.9rem;
  }
  textarea { resize: vertical; height: 120px; line-height: 1.4; }
  
  /* 미디어 등록 영역 */
  .media-slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot {
    border: 1px dashed #555; border-radius: 6px; padding: 10px; text-align: center;
    background: #181818; cursor: pointer; position: relative;
  }
  .slot input { display: none; }
  .slot span { font-size: 0.75rem; color: #bbb; display: block; margin-bottom: 4px; }
  .slot .thumb-prev { width: 100%; height: 60px; object-fit: cover; border-radius: 4px; display: none; margin-top: 4px; }

  /* 액션 버튼 */
  .action-btns { grid-column: span 2; display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; }
  .btn {
    background: var(--primary); color: #fff; border: none; padding: 12px 20px;
    border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem;
  }
  .btn-sub { background: #333; }
  .btn:hover { opacity: 0.9; }

  /* 2. 하단 카드 미리보기 & 인라인 편집 섹션 */
  .preview-section { margin-top: 20px; }
  .cards-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;
  }
  .card-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  
  /* 인스타 4:5 캔버스 규격 (320x400) */
  .insta-canvas {
    width: 320px; height: 400px; background: #000; position: relative;
    overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .insta-canvas img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.65);
  }
  .insta-canvas .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.95) 100%);
    z-index: 2;
  }
  .insta-canvas .content { position: relative; z-index: 3; padding: 18px; }
  .badge { background: var(--primary); font-size: 0.65rem; padding: 3px 6px; border-radius: 3px; font-weight: bold; display: inline-block; margin-bottom: 6px; }
  .title { font-size: 1.05rem; font-weight: bold; line-height: 1.35; margin-bottom: 6px; color: #fff; }
  .desc { font-size: 0.75rem; color: #ccc; line-height: 1.4; white-space: pre-line; }

  /* 카드별 인라인 수정 폼 */
  .card-edit-form { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .card-edit-form input, .card-edit-form textarea {
    padding: 6px; font-size: 0.8rem; height: auto;
  }
  .card-edit-form textarea { height: 48px; }
</style>
</head>
<body>

  <h1>🎬 인스타 전용 뉴스 카드 생성기 (포스터 1장 + 스틸 5장)</h1>

  <!-- 1. 원스톱 입력 대시보드 -->
  <div class="input-dashboard">
    <div>
      <div class="form-group">
        <label>기사 제목</label>
        <input type="text" id="raw-title" value="늑대인간 아론 테일러-존슨, 로버트 에거스 감독 신작 '웨어울프'">
      </div>
      <div class="form-group">
        <label>기사 원문</label>
        <textarea id="raw-article">영화 '노스페라투' 로버트 에거스 감독의 차기작 '웨어울프'(Werewulf)의 공식 예고편이 공개됐다.

포커스 피처스가 공개한 예고편은 13세기 영국을 배경으로 마을의 민담이 끔찍한 현실이 되는 과정을 그린다. '노스페라투'에서 함께했던 아론 테일러-존슨이 저주받은 농부로 분해 처절한 변신을 선보이며 타이틀 크리처를 연기한다.

테일러-존슨을 비롯해 릴리-로즈 뎁, 윌렘 대포가 다시 뭉쳐 에거스 사단을 완성했다. 에거스 감독은 각본을 아이슬란드 시인 숀(Sjón)과 공동 집필했으며, "내가 쓴 것 중 가장 어두운 작품"이라고 직접 밝힌 바 있다.

영화는 고증을 위해 옥스퍼드대 교수진과 협업해 중세 영어로 대사를 구성했고, 특유의 4:3 화면비와 거친 질감으로 중세의 공포를 담아냈다. 포커스 피처스는 "헌신과 저주, 내면의 악마에 대한 처절한 이야기"라고 소개했다.

'웨어울프'는 2026년 12월 25일 미국 극장 개봉을 확정했으며, 영국에서는 2027년 1월 1일 개봉 예정이다. 지난해 크리스마스를 뱀파이어로 물들였던 '노스페라투'에 이어, 올해 크리스마스는 늑대인간이 극장가를 장악할 전망이다.</textarea>
      </div>
      <div class="form-group">
        <label>유튜브 영상 URL</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="yt-url" value="https://youtu.be/CL1EFACsWag" style="flex:1;">
          <button class="btn btn-sub" onclick="applyYoutubeThumbnail()">썸네일 추출 적용</button>
        </div>
      </div>
    </div>

    <div>
      <label>이미지 슬롯 (클릭하여 파일 등록)</label>
      <div class="media-slots" style="margin-top:8px;">
        <div class="slot" onclick="document.getElementById('file-0').click()">
          <span>[포스터/커버]</span>
          <input type="file" id="file-0" accept="image/*" onchange="loadMedia(0, this)">
          <img id="prev-0" class="thumb-prev">
        </div>
        <div class="slot" onclick="document.getElementById('file-1').click()">
          <span>[스틸 1]</span>
          <input type="file" id="file-1" accept="image/*" onchange="loadMedia(1, this)">
          <img id="prev-1" class="thumb-prev">
        </div>
        <div class="slot" onclick="document.getElementById('file-2').click()">
          <span>[스틸 2]</span>
          <input type="file" id="file-2" accept="image/*" onchange="loadMedia(2, this)">
          <img id="prev-2" class="thumb-prev">
        </div>
        <div class="slot" onclick="document.getElementById('file-3').click()">
          <span>[스틸 3]</span>
          <input type="file" id="file-3" accept="image/*" onchange="loadMedia(3, this)">
          <img id="prev-3" class="thumb-prev">
        </div>
        <div class="slot" onclick="document.getElementById('file-4').click()">
          <span>[스틸 4]</span>
          <input type="file" id="file-4" accept="image/*" onchange="loadMedia(4, this)">
          <img id="prev-4" class="thumb-prev">
        </div>
        <div class="slot" onclick="document.getElementById('file-5').click()">
          <span>[스틸 5]</span>
          <input type="file" id="file-5" accept="image/*" onchange="loadMedia(5, this)">
          <img id="prev-5" class="thumb-prev">
        </div>
      </div>
    </div>

    <div class="action-btns">
      <button class="btn btn-sub" onclick="copyCaption()">📋 인스타 캡션 복사</button>
      <button class="btn" onclick="downloadAll()">💾 카드 6장 전체 다운로드 (.png)</button>
    </div>
  </div>

  <!-- 2. 카드 6장 미리보기 & 인라인 편집기 -->
  <h2>카드뉴스 구성 (4:5 비율 / 인라인 편집 가능)</h2>
  <div class="cards-grid" id="cards-container"></div>

<script>
// 초기 카드 기본값
const cardConfigs = [
  { badge: "OFFICIAL TRAILER", title: "로버트 에거스 신작\n〈웨어울프〉 예고편 공개", desc: "13세기 영국, 마을의 민담이 현실이 된다.\n올해 크리스마스 극장가를 장악할 공포.", img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80" },
  { badge: "CASTING", title: "저주받은 농부로 분한\n아론 테일러-존슨의 변신", desc: "〈노스페라투〉에 이어 타이틀 크리처 완벽 소화.\n릴리-로즈 뎁, 윌렘 대포 재결합.", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" },
  { badge: "DIRECTING", title: "“내가 쓴 것 중\n가장 어두운 작품”", desc: "시인 숀(Sjón)과 공동 집필한 각본.\n옥스퍼드대 자문 중세 영어 대사 구성.", img: "https://images.unsplash.com/photo-1514539079130-25950c84af65?auto=format&fit=crop&w=600&q=80" },
  { badge: "VISUAL", title: "4:3 화면비와 거친 질감\n중세의 날 것 그대로", desc: "단순 크리처물을 넘어선 심리 공포.\n헌신과 저주, 내면의 악마를 다룬 서사.", img: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=600&q=80" },
  { badge: "RELEASE", title: "2026. 12. 25\n북미 극장 개봉 확정", desc: "지난해 뱀파이어에 이어\n올해는 처절한 늑대인간의 차례.", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" },
  { badge: "TRAILER", title: "유튜브 공식 예고편\n지금 바로 감상", desc: "프로필 링크에서 풀버전 확인 가능.\n댓글로 기대평을 남겨주세요!", img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80" }
];

function renderCards() {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  cardConfigs.forEach((cfg, idx) => {
    const box = document.createElement('div');
    box.className = 'card-box';
    box.innerHTML = `
      <div class="insta-canvas" id="canvas-${idx}">
        <img class="bg" id="card-img-${idx}" src="${cfg.img}">
        <div class="overlay"></div>
        <div class="content">
          <div class="badge" id="c-badge-${idx}">${cfg.badge}</div>
          <div class="title" id="c-title-${idx}">${cfg.title.replace(/\n/g, '<br>')}</div>
          <div class="desc" id="c-desc-${idx}">${cfg.desc}</div>
        </div>
      </div>
      <div class="card-edit-form">
        <input type="text" value="${cfg.badge}" oninput="updateCard(${idx}, 'badge', this.value)">
        <input type="text" value="${cfg.title.replace(/\n/g, '\\n')}" oninput="updateCard(${idx}, 'title', this.value.replace(/\\\\n/g, '\n'))">
        <textarea oninput="updateCard(${idx}, 'desc', this.value)">${cfg.desc}</textarea>
        <button class="btn btn-sub" style="padding:6px; font-size:0.75rem;" onclick="downloadSingle(${idx})">이 카드 다운로드</button>
      </div>
    `;
    container.appendChild(box);
  });
}

function updateCard(idx, key, val) {
  cardConfigs[idx][key] = val;
  if(key === 'badge') document.getElementById(`c-badge-${idx}`).innerText = val;
  if(key === 'title') document.getElementById(`c-title-${idx}`).innerHTML = val.replace(/\n/g, '<br>');
  if(key === 'desc') document.getElementById(`c-desc-${idx}`).innerText = val;
}

function loadMedia(idx, input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById(`card-img-${idx}`).src = e.target.result;
      const prev = document.getElementById(`prev-${idx}`);
      prev.src = e.target.result;
      prev.style.display = 'block';
      cardConfigs[idx].img = e.target.result;
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function applyYoutubeThumbnail() {
  const url = document.getElementById('yt-url').value;
  let videoId = "";
  if (url.includes("youtu.be/")) videoId = url.split("youtu.be/")[1].split("?")[0];
  else if (url.includes("watch?v=")) videoId = url.split("watch?v=")[1].split("&")[0];

  if (videoId) {
    const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
    // 마지막 6번째 카드에 자동 세팅
    document.getElementById('card-img-5').src = thumbUrl;
    cardConfigs[5].img = thumbUrl;
    alert("6번(예고편) 카드의 배경으로 유튜브 썸네일을 적용했습니다.");
  } else {
    alert("올바른 유튜브 링크를 입력하세요.");
  }
}

async function downloadSingle(idx) {
  const node = document.getElementById(`canvas-${idx}`);
  const canvas = await html2canvas(node, { scale: 3.375 }); // 1080x1350 대응
  const link = document.createElement('a');
  link.download = `insta_news_${idx + 1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function downloadAll() {
  for (let i = 0; i < cardConfigs.length; i++) {
    await downloadSingle(i);
    await new Promise(r => setTimeout(r, 350));
  }
}

function copyCaption() {
  const cap = `🩸 ${document.getElementById('raw-title').value}\n\n${document.getElementById('raw-article').value.substring(0, 180)}...\n\n🎬 예고편 링크: ${document.getElementById('yt-url').value}\n\n#영화 #신작영화 #카드뉴스`;
  navigator.clipboard.writeText(cap);
  alert("인스타그램 캡션이 클립보드에 복사되었습니다!");
}

renderCards();
</script>
</body>
</html>
